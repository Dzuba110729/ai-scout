<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI-Скаут{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f6f8;
            --sidebar-bg: #17181c;
            --sidebar-fg: #b8bcc6;
            --sidebar-fg-active: #fff;
            --sidebar-accent: #2f7bff;
            --text: #1c1e21;
            --muted: #6b7280;
            --border: #e5e7eb;
            --card-bg: #fff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* --- Сайдбар --- */
        .sidebar {
            width: 220px;
            flex: 0 0 220px;
            background: var(--sidebar-bg);
            color: var(--sidebar-fg);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .sidebar .brand {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            padding: 0 20px 20px;
        }
        .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
        .sidebar nav a {
            color: var(--sidebar-fg);
            text-decoration: none;
            font-size: 14px;
            padding: 10px 20px;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar nav a .icon { font-size: 15px; width: 18px; text-align: center; }
        .sidebar nav a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .sidebar nav a.active {
            color: var(--sidebar-fg-active);
            background: rgba(47,123,255,0.15);
            border-left-color: var(--sidebar-accent);
        }

        /* --- Контент --- */
        .content { flex: 1; min-width: 0; padding: 28px 32px; max-width: 1100px; }
        h1 { font-size: 20px; margin: 0 0 20px; }
        h2 { font-size: 16px; margin: 0 0 12px; }
        h3 { font-size: 14px; margin: 0 0 8px; }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
        }
        .badge-active { background: #e3f7e9; color: #1a7f37; }
        .badge-needs_session { background: #fdecea; color: #c62828; }
        .badge-paused { background: #eee; color: #555; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-changed { background: #fff8e1; color: #b28704; }
        .badge-removed { background: #fdecea; color: #c62828; }
        .muted { color: var(--muted); font-size: 13px; }
        a.link { color: #1565c0; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        pre.diff { background: #17181c; color: #eee; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
        pre.diff .add { color: #7ee787; }
        pre.diff .del { color: #ff7b72; }
        /* --- Двухколоночный вид «было/стало» --- */
        .sbs { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-height: 620px; overflow-y: auto; }
        .sbs-head, .sbs-row { display: grid; grid-template-columns: 1fr 1fr; }
        .sbs-head { position: sticky; top: 0; background: #fafbfc; border-bottom: 1px solid var(--border); z-index: 1; }
        .sbs-col-title { padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
        .sbs-col-title + .sbs-col-title { border-left: 1px solid var(--border); }
        .sbs-cell { padding: 6px 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .sbs-cell + .sbs-cell { border-left: 1px solid var(--border); }
        .sbs-equal { color: var(--muted); }
        .sbs-changed .sbs-old, .sbs-removed .sbs-old { background: #ffeef0; }
        .sbs-changed .sbs-new, .sbs-added .sbs-new { background: #e6ffed; }
        .sbs-skip { padding: 4px 12px; font-size: 12px; color: var(--muted); background: #fafbfc; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .sbs-label { display: none; }
        .only-narrow { display: none; }
        .page-content { max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
        .page-content p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
        .page-content p:last-child { margin-bottom: 0; }
        .competitor-group { background: var(--card-bg); border-radius: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden; }
        .competitor-group summary { padding: 14px 20px; cursor: pointer; list-style: none; }
        .competitor-group summary::-webkit-details-marker { display: none; }
        .competitor-group-body { padding: 0 20px 16px; }
        .change-card { margin-bottom: 8px; box-shadow: none; border: 1px solid var(--border); }
        .change-card:last-child { margin-bottom: 0; }
        .danger-btn { background: #fdecea; color: #c62828; }

        /* --- Блок «есть ли такое у нас на сайте» --- */
        .own-check { border-left: 3px solid var(--border); padding-left: 12px; margin-top: 10px; font-size: 13px; }
        .own-check p { margin: 0 0 6px; }
        .own-check p:last-child { margin-bottom: 0; }
        .own-check-exact { border-left-color: #1a7f37; }
        .own-check-similar { border-left-color: #b28704; }
        .own-check-none { border-left-color: #c62828; }
        .card.own-check { border-left-width: 4px; border-left-style: solid; padding-left: 16px; font-size: 14px; }

        /* --- Карточка «наш сайт»: явно не конкурент --- */
        .own-site-card { border-left: 4px solid var(--sidebar-accent); }
        .badge-own { background: #e8f0ff; color: #1a4fa0; }
        button, .btn {
            background: var(--sidebar-bg); color: #fff; border: none; border-radius: 6px;
            padding: 6px 12px; font-size: 13px; cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        button.secondary-btn, .btn.secondary-btn { background: #fff; color: var(--text); border: 1px solid var(--border); }
        input, select {
            padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px;
        }
        label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }

        /* --- Таблица (список конкурентов) --- */
        table.data-table { width: 100%; border-collapse: collapse; }
        table.data-table th {
            text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
            padding: 8px 12px; border-bottom: 1px solid var(--border);
        }
        table.data-table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        table.data-table tr:last-child td { border-bottom: none; }
        table.data-table tr.clickable-row { cursor: pointer; }
        table.data-table tr.clickable-row:hover { background: #fafbfc; }

        /* --- Карточки-счётчики дашборда --- */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-tile { background: var(--card-bg); border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
        .stat-tile .value { font-size: 26px; font-weight: 700; }
        .stat-tile .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .stat-tile.attention .value { color: #c62828; }

        /* --- Вкладки на карточке конкурента --- */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .tabs button.tab-btn {
            background: none; color: var(--muted); border: none; border-bottom: 2px solid transparent;
            border-radius: 0; padding: 10px 4px; margin-right: 20px; font-size: 14px; cursor: pointer;
        }
        .tabs button.tab-btn.active { color: var(--text); border-bottom-color: var(--sidebar-accent); font-weight: 600; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* --- Диалог добавления конкурента --- */
        dialog { border: none; border-radius: 10px; padding: 0; max-width: 420px; width: 90%; }
        dialog::backdrop { background: rgba(0,0,0,0.4); }
        dialog .dialog-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

        /* --- Панель фильтров ленты изменений --- */
        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }

        .breadcrumb { margin-bottom: 12px; }

        /* --- Постраничная навигация --- */
        .pager {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; flex-wrap: wrap; margin: 12px 0;
        }
        .pager-info { font-size: 13px; color: var(--muted); }
        .pager-sub { display: block; }
        .pager-buttons { display: flex; gap: 8px; }
        .pager-buttons .btn { text-decoration: none; }
        .pager-disabled { opacity: 0.45; cursor: default; }

        /* Длинные адреса страниц не должны растягивать вёрстку. */
        .muted, .breadcrumb, td a.link, .pager-info, .page-content p { overflow-wrap: anywhere; }

        /* Таблицы шире экрана прокручиваются внутри своего блока, а не всей страницей. */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-wrap table.data-table { min-width: 640px; }

        /* --- Верхняя панель с кнопкой меню: только на узком экране --- */
        .topbar { display: none; }
        .sidebar-overlay { display: none; }

        @media (max-width: 860px) {
            body { display: block; padding-top: 52px; }

            .topbar {
                display: flex; align-items: center; gap: 12px;
                position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 30;
                background: var(--sidebar-bg); color: #fff; padding: 0 12px;
            }
            .topbar-brand { font-weight: 700; font-size: 16px; }
            .menu-toggle {
                background: none; border: none; color: #fff; font-size: 22px;
                line-height: 1; padding: 8px 10px; border-radius: 6px; cursor: pointer;
            }

            .sidebar {
                position: fixed; top: 0; left: 0; z-index: 40;
                width: 260px; flex-basis: 260px; height: 100vh; padding-top: 20px;
                transform: translateX(-100%); transition: transform 0.2s ease;
                overflow-y: auto;
            }
            body.menu-open .sidebar { transform: translateX(0); }
            body.menu-open { overflow: hidden; }

            .sidebar-overlay {
                display: block; position: fixed; inset: 0; z-index: 35;
                background: rgba(0,0,0,0.45);
            }
            .sidebar-overlay[hidden] { display: none; }

            .sidebar nav a { padding: 14px 20px; font-size: 15px; }

            .content { padding: 16px 14px; max-width: 100%; }
            h1 { font-size: 18px; }
            .card { padding: 14px 16px; }

            /* Фильтры ленты складываются в колонку. */
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .field, .filter-bar input, .filter-bar select { width: 100%; }
            .filter-bar > .btn, .filter-bar > button { width: 100%; text-align: center; }

            /* Пальцем надо попадать: увеличенные кнопки и поля ввода. */
            button, .btn { padding: 11px 16px; font-size: 14px; min-height: 44px; }
            .tabs button.tab-btn { min-height: 44px; padding: 10px 2px; margin-right: 14px; }
            input, select { padding: 10px 12px; font-size: 16px; min-height: 44px; }

            /* Две колонки «было/стало» не помещаются рядом — ставим друг под друга
               и подписываем каждую, иначе непонятно, где что. */
            .sbs-head { display: none; }
            .sbs-row { grid-template-columns: 1fr; }
            .sbs-cell:empty { display: none; }
            .sbs-cell + .sbs-cell { border-left: none; }
            .sbs-row { border-bottom: 1px solid var(--border); }
            .sbs-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
            .only-wide { display: none; }
            .only-narrow { display: inline; }

            .pager { flex-direction: column; align-items: stretch; }
            .pager-buttons { display: grid; grid-template-columns: 1fr 1fr; }
            .pager-buttons .btn { text-align: center; }

            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-tile .value { font-size: 22px; }

            .tabs { overflow-x: auto; }
            .tabs button.tab-btn { white-space: nowrap; }

            .page-content { max-height: 360px; }
            pre.diff { font-size: 12px; }

            /* Заголовки страниц с кнопкой справа: в колонку. */
            .page-header { flex-direction: column; align-items: stretch !important; gap: 12px; }
            .page-header button, .page-header .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
        <span class="topbar-brand">AI-Скаут</span>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand">AI-Скаут</div>
        <nav>
            <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}"><span class="icon">&#9673;</span> Дашборд</a>
            <a href="/competitors" class="{{ 'active' if active_nav == 'competitors' else '' }}"><span class="icon">&#9737;</span> Конкуренты</a>
            <a href="/changes" class="{{ 'active' if active_nav == 'changes' else '' }}"><span class="icon">&#9776;</span> Лента изменений</a>
            <a href="/settings" class="{{ 'active' if active_nav == 'settings' else '' }}"><span class="icon">&#9881;</span> Настройки</a>
        </nav>
    </aside>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <script>
    (function () {
        const toggle = document.getElementById("menu-toggle");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebar-overlay");

        function setMenu(open) {
            document.body.classList.toggle("menu-open", open);
            overlay.hidden = !open;
            toggle.setAttribute("aria-expanded", open ? "true" : "false");
            toggle.setAttribute("aria-label", open ? "Закрыть меню" : "Открыть меню");
        }

        toggle.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
        overlay.addEventListener("click", () => setMenu(false));
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });
        sidebar.querySelectorAll("nav a").forEach((a) => a.addEventListener("click", () => setMenu(false)));
    })();
    </script>
</body>
</html>
