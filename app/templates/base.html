<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI-Скаут{% endblock %}</title>
    <style>
        :root { color-scheme: light; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f5f6f8;
            color: #1c1e21;
        }
        header {
            background: #17181c;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        header a { color: #d6d9df; text-decoration: none; font-size: 14px; }
        header a.active, header a:hover { color: #fff; }
        header .brand { font-weight: 700; margin-right: auto; color: #fff; }
        main { max-width: 960px; margin: 0 auto; padding: 24px; }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
        }
        .badge-active { background: #e3f7e9; color: #1a7f37; }
        .badge-needs_session { background: #fdecea; color: #c62828; }
        .badge-paused { background: #eee; color: #555; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-changed { background: #fff8e1; color: #b28704; }
        .badge-removed { background: #fdecea; color: #c62828; }
        .muted { color: #6b7280; font-size: 13px; }
        a.link { color: #1565c0; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        pre.diff { background: #17181c; color: #eee; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
        pre.diff .add { color: #7ee787; }
        pre.diff .del { color: #ff7b72; }
        .page-content { max-height: 520px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 12px 16px; }
        .page-content p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
        .page-content p:last-child { margin-bottom: 0; }
        .competitor-group { background: #fff; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden; }
        .competitor-group summary { padding: 14px 20px; cursor: pointer; list-style: none; }
        .competitor-group summary::-webkit-details-marker { display: none; }
        .competitor-group-body { padding: 0 20px 16px; }
        .change-card { margin-bottom: 8px; box-shadow: none; border: 1px solid #eee; }
        .change-card:last-child { margin-bottom: 0; }
        .danger-btn { background: #fdecea; color: #c62828; }
        button, .btn {
            background: #17181c; color: #fff; border: none; border-radius: 6px;
            padding: 6px 12px; font-size: 13px; cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <span class="brand">AI-Скаут</span>
        <a href="/">Конкуренты</a>
        <a href="/changes">Лента изменений</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
